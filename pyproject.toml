[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "d3blocks"
dynamic = ["version"]
authors = [{ name = "Erdogan Taskesen", email = "erdogant@gmail.com" },]
description = "Python package d3blocks."
readme = "README.md"
requires-python = ">=3"
license = "GPL-3.0-or-later"
keywords = [
    "Python",
    "visualizations",
    "interactive",
    "javascript",
    "d3js",
    "d3blocks",
    "network",
    "graph",
    "data visualization",
    "web",
    "extendable",
    "extension",
    "plugin",
    "modular",
    "customizable"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: Unix",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
dependencies = [
    'numpy',
    'colourmap>=1.1.10',
    'datazets>=0.1.7',
    'd3graph>=3.2.0',
    'ismember>=1.0.1',
    'pandas<3',
    'tqdm',
    'requests',
    'jinja2',
    'scikit-learn',
]


[project.urls]
Homepage = "https://d3blocks.github.io/d3blocks"
Download = "https://github.com/d3blocks/d3blocks/archive/{version}.tar.gz"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["d3blocks*"]

[tool.setuptools.dynamic]
version = { attr = "d3blocks.__version__" }

[tool.ruff.lint]
# Formatting is ruff format with its Black-compatible defaults (88 columns, double quotes).
# Lint: pycodestyle errors (E), pyflakes (F) and import sorting (I). Line length is left
# to the formatter, which does not split long strings.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# A scratch file of `# %%` cells, each importing what it needs.
"d3blocks/examples.py" = ["E402"]
