    <style>:root {
  --bg: #222;
  --panel-bg: rgba(34, 34, 34, 0.92);
  --panel-border: rgba(255, 255, 255, 0.15);
  --panel-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
  --dropdown-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
  --text: #eee;
  --text-muted: rgba(238, 238, 238, 0.6);
  --btn-bg: #333;
  --btn-bg-active: #3d3d3d;
  --btn-border: #555;
  --btn-text: #eee;
  --tooltip-bg: rgba(34, 34, 34, 0.95);
  --tooltip-text: #fff;
  --transition: background 0.2s, color 0.2s, border-color 0.25s;
  --accent: #1ABC9C;
  --topbar-bg: rgba(34, 34, 34, 0.4);
  --search-hover: #1e4d42;
}
body.light {
  --bg: #fff;
  --panel-bg: rgba(255, 255, 255, 0.92);
  --panel-border: rgba(0, 0, 0, 0.1);
  --panel-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
  --dropdown-shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
  --text: #222;
  --text-muted: rgba(34, 34, 34, 0.55);
  --btn-bg: #fff;
  --btn-bg-active: #eee;
  --btn-border: #ccc;
  --btn-text: #222;
  --tooltip-bg: rgba(255, 255, 255, 0.96);
  --tooltip-text: #1a1a1a;
  --accent: #1ABC9C;
  --topbar-bg: rgba(255, 255, 255, 0.4);
  --search-hover: #e8f8f5;
}
html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  overflow: hidden;
  transition: var(--transition);
  color: var(--text);
}

.stats-panel {
  position: fixed;
  display: flex;
  flex-direction: column;
  resize: both;
  overflow: hidden;
  top: 10px;
  left: 10px;
  z-index: 1000;
  background: var(--panel-bg);
  color: var(--text);
  border-radius: 8px;
  padding: 10px 14px;
  box-shadow: var(--panel-shadow);
  font-family: "Helvetica", Arial, sans-serif;
  font-size: 13px;
  width: 220px;
  min-width: 180px;
  max-width: min(600px, calc(100vw - 40px));
  border: 1px solid var(--panel-border);
  transition: background 0.25s, color 0.25s, border-color 0.25s;
  min-height: 40px;
  max-height: calc(100vh - 40px);
}
.stats-panel.collapsed { resize: none; }
.stats-panel-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
}
.stats-panel .stats-panel-title {
  font-weight: bold;
  margin-bottom: 6px;
  cursor: grab;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.stats-panel .stats-panel-title:active { cursor: grabbing; }
.stats-panel.drag-over {
  outline: 2px dashed var(--accent);
  outline-offset: 2px;
}
.stats-panel.collapsed .stats-panel-title { margin-bottom: 0; }
.stats-panel.collapsed .stats-panel-body { display: none; }
.stats-panel-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-left: 8px;
  flex-shrink: 0;
  color: inherit;
  transition: transform 0.15s ease;
}
.stats-panel-toggle svg { width: 12px; height: 12px; display: block; }
.stats-panel.collapsed .stats-panel-toggle { transform: rotate(-90deg); }
.stats-panel label { display: block; margin: 4px 0; cursor: pointer; }
.stats-panel .physics-control { margin: 10px 0; }
.stats-panel .physics-control label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 3px;
  cursor: default;
  font-weight: normal;
}
.stats-panel .physics-control input[type="range"] {
  width: 100%;
  box-sizing: border-box;
  accent-color: var(--accent);
}
.stats-panel .button-switch {
  display: block;
  width: 100%;
  text-align: center;
  margin: 10px 0 0 0;
  box-sizing: border-box;
}
.button-switch {
  display: inline-block;
  margin: 8px 4px;
  padding: 6px 16px;
  border-radius: 6px;
  border: 1px solid var(--btn-border);
  background: var(--btn-bg);
  color: var(--btn-text);
  cursor: pointer;
  font-size: 1em;
  font-family: "Helvetica", Arial, sans-serif;
  transition: var(--transition);
}
.button-switch:active { background: var(--btn-bg-active); }
.button-switch.active {
  background: var(--btn-bg-active);
  border-color: var(--btn-border);
  color: var(--btn-text);
}
.button-switch:disabled { opacity: 0.45; cursor: default; }

.mode-row {
  display: flex;
  gap: 8px;
  margin: 6px 0 4px 0;
}
.mode-row label {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0;
  cursor: pointer;
  font-weight: normal;
}
.top-mode {
  margin: 0;
  gap: 16px;
  color: var(--text);
  font-size: 13px;
}
.top-mode label {
  flex: 0 0 auto;
  white-space: nowrap;
}

.top-panel {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  z-index: 1200;
  padding: 8px 14px;
  border-radius: 8px;
  background: var(--topbar-bg);
  box-shadow: var(--panel-shadow);
  transition: var(--transition);
  pointer-events: none;
}
/* Light mode: no drop shadow so a white/light bar does not sit under a dark shadow. */
body.light .top-panel {
  box-shadow: none;
}

.top-panel .top-panel-left {
  pointer-events: none;
  justify-self: start;
  width: max-content;
}
.top-panel .top-panel-left a {
  pointer-events: auto;
  display: inline-block;
  line-height: 0;
}
.top-panel .top-panel-center {
  pointer-events: auto;
  display: flex;
  justify-content: center;
  align-items: center;
}
.top-panel .top-panel-right {
  pointer-events: auto;
  display: flex;
  gap: 8px;
  align-items: center;
  justify-self: end;
}
.top-panel .button-switch { margin: 0; }

#treemap-main {
  width: 100%;
  box-sizing: border-box;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  /* Fallback before JS measures the top panel (logo load, font metrics). */
  margin-top: 80px;
}
#treemap-container {
  position: relative;
  margin: 0 auto;
}
.node {
  font: 10px sans-serif;
  line-height: 12px;
  overflow: hidden;
  text-indent: 2px;
  color: #fff;
  box-sizing: border-box;
}
body.light .node {
  color: #111;
}</style>
    <!-- Center + top panel + side panels: per-theme backgrounds.
         Theme toggle (body.light) switches which color is used. -->
    <style>
      body {
        background: #222222;
      }
      body .top-panel {
        background: #222222;
      }
      body .stats-panel {
        background: #222222;
      }
      body.light {
        background: #ffffff;
      }
      body.light .top-panel {
        background: #ffffff;
      }
      body.light .stats-panel {
        background: #ffffff;
      }
    </style>

const margin = {top: 40, right: 10, bottom: 10, left: 10};
const width = 1000 - margin.left - margin.right;
const height = 600 - margin.top - margin.bottom;
const color = d3.scaleOrdinal().range(d3.schemeCategory20c);

let currentFontSize = 10;
let currentBorderWidth = 0;
const borderType = "solid";
const borderColor = "#FFFFFF";
const fontType = "sans-serif";
const fontPosition = "absolute";

const treemap = d3.treemap().size([width, height]);

const container = d3.select("#treemap-container")
    .style("position", "relative")
    .style("width", (width + margin.left + margin.right) + "px")
    .style("height", (height + margin.top + margin.bottom) + "px");

const div = container.append("div")
    .style("position", "relative")
    .style("width", width + "px")
    .style("height", height + "px")
    .style("left", margin.left + "px")
    .style("top", margin.top + "px");

function sumBySize(d) { return d.size; }
function sumByCount(d) { return d.size ? 1 : 0; }

const initialMode = "size";
let valueFn = initialMode === "count" ? sumByCount : sumBySize;
let root = d3.hierarchy(data, (d) => d.children).sum(valueFn);
let tree = treemap(root);

function applyNodeStyle(selection) {
  selection
    .style("border", borderType + " " + currentBorderWidth + "px " + borderColor)
    .style("font", currentFontSize + "px " + fontType)
    .style("position", fontPosition)
    .style("line-height", Math.max(12, currentFontSize + 2) + "px");
}

let node = div.datum(root).selectAll(".node")
    .data(tree.leaves())
  .enter().append("div")
    .attr("class", "node")
    .style("left", (d) => d.x0 + "px")
    .style("top", (d) => d.y0 + "px")
    .style("width", (d) => Math.max(0, d.x1 - d.x0 - 1) + "px")
    .style("height", (d) => Math.max(0, d.y1 - d.y0 - 1) + "px")
    .style("background", (d) => color(d.parent.data.name))
    .text((d) => d.data.name)
    .attr("title", (d) => (node_properties[d.data.name] && node_properties[d.data.name].tooltip) || "");

applyNodeStyle(node);

function updateLayout(duration) {
  root = d3.hierarchy(data, (d) => d.children).sum(valueFn);
  tree = treemap(root);
  const sel = node.data(tree.leaves());
  const t = sel.transition().duration(duration || 0);
  t.style("left", (d) => d.x0 + "px")
   .style("top", (d) => d.y0 + "px")
   .style("width", (d) => Math.max(0, d.x1 - d.x0 - 1) + "px")
   .style("height", (d) => Math.max(0, d.y1 - d.y0 - 1) + "px");
  applyNodeStyle(sel);
}

d3.selectAll('input[name="mode"]').on("change", function() {
  valueFn = this.value === "count" ? sumByCount : sumBySize;
  updateLayout(1500);
});

const fontSlider = document.getElementById("fontSizeSlider");
const fontVal = document.getElementById("fontSizeVal");
if (fontSlider) {
  fontSlider.addEventListener("input", function() {
    currentFontSize = +fontSlider.value;
    if (fontVal) fontVal.textContent = currentFontSize;
    applyNodeStyle(node);
  });
}

const borderSlider = document.getElementById("borderWidthSlider");
const borderVal = document.getElementById("borderWidthVal");
if (borderSlider) {
  borderSlider.addEventListener("input", function() {
    currentBorderWidth = +borderSlider.value;
    if (borderVal) borderVal.textContent = currentBorderWidth;
    applyNodeStyle(node);
  });
}

// Export hierarchy as JSON
function hierarchyToPlain(d) {
  if (!d) return null;
  const out = { name: (d.name != null ? d.name : "") };
  if (d.size != null) out.size = d.size;
  if (d.children && d.children.length) out.children = d.children.map(hierarchyToPlain);
  return out;
}
const exportBtn = document.getElementById("exportButton");
if (exportBtn) {
  exportBtn.addEventListener("click", function() {
    const payload = hierarchyToPlain(data);
    if (!payload) { alert("Data not ready."); return; }
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "treemap-export.json";
    document.body.appendChild(a);
    a.click();
    setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  });
}

                var svgData = svgEl.outerHTML;
                var blob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
                var url = URL.createObjectURL(blob);
                var link = document.createElement('a');
                link.href = url;
                link.download = 'Treemap - D3blocks.svg';
                link.click();
            });
        })();
        

// Top bar clearance + side panels: position, collapse, reorder
// When top panel is absent, treat its height as 0 (do not return early).
(function() {
  var PANEL_ORDER = ['exportPanel', 'physicsPanel'];

  function positionSidePanels() {
    var bar = document.querySelector('.top-panel');
    var main = document.getElementById('treemap-main');
    var bottom = bar ? bar.getBoundingClientRect().bottom : 0;
    if (main) main.style.marginTop = (bottom + 12) + 'px';
    var y = bottom + 8;
    var bottomPad = 12;
    PANEL_ORDER.forEach(function(id) {
      var panel = document.getElementById(id);
      if (!panel || panel.style.display === 'none') return;
      panel.style.top = y + 'px';
      panel.style.maxHeight = Math.max(80, window.innerHeight - y - bottomPad) + 'px';
      y += panel.getBoundingClientRect().height + 10;
    });
  }
  window.addEventListener('resize', positionSidePanels);
  window.addEventListener('load', positionSidePanels);
  positionSidePanels();
  requestAnimationFrame(positionSidePanels);
  if (typeof ResizeObserver !== 'undefined') {
    var bar = document.querySelector('.top-panel');
    if (bar) new ResizeObserver(function() { positionSidePanels(); }).observe(bar);
    PANEL_ORDER.forEach(function(id) {
      var el = document.getElementById(id);
      if (!el) return;
      new ResizeObserver(function() { positionSidePanels(); }).observe(el);
    });
  }

  PANEL_ORDER.forEach(function(panelId) {
    var panel = document.getElementById(panelId);
    if (!panel) return;
    var title = panel.querySelector('.stats-panel-title');
    if (!title) return;
    title.addEventListener('click', function() {
      if (title.dataset.justDragged === '1') { title.dataset.justDragged = '0'; return; }
      var collapsing = !panel.classList.contains('collapsed');
      if (collapsing) {
        if (panel.style.height) panel.dataset.expandedHeight = panel.style.height;
        panel.style.height = '';
      } else if (panel.dataset.expandedHeight) {
        panel.style.height = panel.dataset.expandedHeight;
      }
      panel.classList.toggle('collapsed');
      setTimeout(positionSidePanels, 0);
    });
  });

  (function setupPanelReordering() {
    PANEL_ORDER.forEach(function(panelId) {
      var panel = document.getElementById(panelId);
      if (!panel) return;
      var title = panel.querySelector('.stats-panel-title');
      if (!title) return;
      title.addEventListener('dragstart', function(e) {
        e.dataTransfer.setData('text/plain', panelId);
        e.dataTransfer.effectAllowed = 'move';
      });
      title.addEventListener('dragend', function() {
        title.dataset.justDragged = '1';
        setTimeout(function() { title.dataset.justDragged = '0'; }, 0);
      });
      panel.addEventListener('dragover', function(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        panel.classList.add('drag-over');
      });
      panel.addEventListener('dragleave', function() { panel.classList.remove('drag-over'); });
      panel.addEventListener('drop', function(e) {
        e.preventDefault();
        panel.classList.remove('drag-over');
        var draggedId = e.dataTransfer.getData('text/plain');
        if (!draggedId || draggedId === panelId) return;
        var from = PANEL_ORDER.indexOf(draggedId), to = PANEL_ORDER.indexOf(panelId);
        if (from < 0 || to < 0) return;
        PANEL_ORDER.splice(from, 1);
        PANEL_ORDER.splice(to, 0, draggedId);
        positionSidePanels();
      });
    });
  })();

  function toggleTheme() {
    document.body.classList.toggle('light');
    var isLight = document.body.classList.contains('light');
    var themeBtn = document.getElementById('themeBtn');
    if (themeBtn) {
      themeBtn.textContent = isLight ? '☀' : '🌙';
      themeBtn.title = isLight ? 'Theme: Light' : 'Theme: Dark';
    }
  }
  var themeBtn = document.getElementById('themeBtn');
  if (themeBtn) themeBtn.addEventListener('click', toggleTheme);
})();
</script>
