<style>:root {
  --bg: #222;
  --panel-bg: rgba(34, 34, 34, 0.92);
  --panel-border: rgba(255, 255, 255, 0.15);
  --panel-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
  --dropdown-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
  --text: #eee;
  --text-muted: rgba(238, 238, 238, 0.6);
  --btn-bg: #333;
  --btn-bg-active: #3d3d3d;
  --btn-border: #555;
  --btn-text: #eee;
  --tooltip-bg: rgba(34, 34, 34, 0.95);
  --tooltip-text: #fff;
  --transition: background 0.2s, color 0.2s, border-color 0.25s;
  --accent: #1ABC9C;
  --topbar-bg: rgba(34, 34, 34, 0.4);
  --search-hover: #1e4d42;
}
body.light {
  --bg: #fff;
  --panel-bg: rgba(255, 255, 255, 0.92);
  --panel-border: rgba(0, 0, 0, 0.1);
  --panel-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
  --dropdown-shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
  --text: #222;
  --text-muted: rgba(34, 34, 34, 0.55);
  --btn-bg: #fff;
  --btn-bg-active: #eee;
  --btn-border: #ccc;
  --btn-text: #222;
  --tooltip-bg: rgba(255, 255, 255, 0.96);
  --tooltip-text: #1a1a1a;
  --accent: #1ABC9C;
  --topbar-bg: rgba(255, 255, 255, 0.4);
  --search-hover: #e8f8f5;
}
html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  font-family: "Helvetica", Arial, sans-serif;
  overflow: hidden;
  transition: var(--transition);
}
.search-wrap { position: relative; margin-bottom: 6px; }
.search-input {
  width: 100%; box-sizing: border-box;
  background: var(--btn-bg); color: var(--btn-text); border: 1px solid var(--btn-border);
  border-radius: 6px; padding: 9px 12px; font-size: 13px;
  font-family: "Helvetica", Arial, sans-serif;
  outline: none; transition: var(--transition), width 0.2s;
}
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { border-color: var(--accent); }
.search-results {
  position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px;
  background: var(--panel-bg); border: 1px solid var(--panel-border);
  border-radius: 6px; max-height: 200px; overflow-y: auto; z-index: 20;
  display: none; box-shadow: var(--dropdown-shadow);
}
.search-results.open { display: block; }
.search-item {
  padding: 7px 12px; font-size: 12px; color: var(--text); cursor: pointer;
  border-bottom: 1px solid var(--panel-border);
}
.search-item:last-child { border-bottom: none; }
.search-item:hover, .search-item.active { background: var(--search-hover); }

.stats-panel {
  position: fixed;
  display: flex;
  flex-direction: column;
  resize: both;
  overflow: hidden;
  top: 10px;
  left: 10px;
  z-index: 1000;
  background: var(--panel-bg);
  color: var(--text);
  border-radius: 8px;
  padding: 10px 14px;
  box-shadow: var(--panel-shadow);
  font-family: "Helvetica", Arial, sans-serif;
  font-size: 13px;
  width: 220px;
  min-width: 180px;
  max-width: min(600px, calc(100vw - 40px));
  border: 1px solid var(--panel-border);
  transition: background 0.25s, color 0.25s, border-color 0.25s;
  min-height: 40px;
  max-height: calc(100vh - 40px);
}
.stats-panel.collapsed { resize: none; }
.stats-panel-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
}
.stats-panel .stats-panel-title {
  font-weight: bold;
  margin-bottom: 6px;
  cursor: grab;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.stats-panel .stats-panel-title:active { cursor: grabbing; }
.stats-panel.drag-over {
  outline: 2px dashed var(--accent);
  outline-offset: 2px;
}
.stats-panel.collapsed .stats-panel-title { margin-bottom: 0; }
.stats-panel.collapsed .stats-panel-body { display: none; }
.stats-panel-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-left: 8px;
  flex-shrink: 0;
  color: inherit;
  transition: transform 0.15s ease;
}
.stats-panel-toggle svg { width: 12px; height: 12px; display: block; }
.stats-panel.collapsed .stats-panel-toggle { transform: rotate(-90deg); }
.stats-panel label { display: block; margin: 4px 0; cursor: pointer; }
.stats-panel .physics-control { margin: 10px 0; }
.stats-panel .physics-control label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 3px;
  cursor: default;
  font-weight: normal;
}
.stats-panel .physics-control input[type="range"] {
  width: 100%;
  box-sizing: border-box;
  accent-color: var(--accent);
}
.stats-panel .button-switch {
  display: block;
  width: 100%;
  text-align: center;
  margin: 10px 0 0 0;
  box-sizing: border-box;
}
.button-switch {
  display: inline-block;
  margin: 8px 4px;
  padding: 6px 16px;
  border-radius: 6px;
  border: 1px solid var(--btn-border);
  background: var(--btn-bg);
  color: var(--btn-text);
  cursor: pointer;
  font-size: 1em;
  font-family: "Helvetica", Arial, sans-serif;
  transition: var(--transition);
}
.button-switch:active { background: var(--btn-bg-active); }
.button-switch.active {
  background: var(--btn-bg-active);
  border-color: var(--btn-border);
  color: var(--btn-text);
}
.button-switch:disabled { opacity: 0.45; cursor: default; }

.top-panel {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  z-index: 1200;
  padding: 8px 14px;
  border-radius: 8px;
  background: var(--topbar-bg);
  box-shadow: var(--panel-shadow);
  transition: var(--transition);
  pointer-events: none;
}
/* Light mode: no dark drop-shadow under the white top bar */
body.light .top-panel {
  box-shadow: none;
}
.top-panel .top-panel-left { pointer-events: none; }
.top-panel .top-panel-left a { pointer-events: auto; }
.top-panel .top-panel-center {
  pointer-events: auto;
  display: flex;
  justify-content: center;
  align-items: center;
}
.top-panel .top-panel-right {
  pointer-events: auto;
  display: flex;
  gap: 8px;
  align-items: center;
  justify-self: end;
}
.top-panel .button-switch { margin: 0; }
/* Match button-switch height/padding so Find sits on the same baseline. */
.top-search {
  width: 440px;
  max-width: 60vw;
  margin-bottom: 0; /* override .search-wrap's 6px which shifts it off-center */
  display: flex;
  align-items: center;
}
.top-search .search-input {
  width: 100%;
  padding: 6px 12px;
  font-size: 1em;
  line-height: normal;
  box-sizing: border-box;
}

#tree-main {
  width: 100%;
  height: 100%;
  box-sizing: border-box;
}
#tree-main .collapsibleTree,
#htmlwidget_container {
  width: 100% !important;
  height: 100% !important;
}
.collapsibleTree .node { cursor: pointer; }
.collapsibleTree .node circle {
  fill: #fff;
  stroke: #000;
}
.collapsibleTree .node text {
  font: 10px sans-serif;
  fill: var(--text);
}
.collapsibleTree .link {
  fill: none;
  stroke: #ccc;
  stroke-width: 1.5px;
}
body.light .collapsibleTree .link { stroke: #999; }
.collapsibleTree div.tooltip {
  position: absolute;
  text-align: center;
  padding: 6px 10px;
  font: 12px sans-serif;
  background: var(--tooltip-bg);
  color: var(--tooltip-text);
  border: 0;
  border-radius: 6px;
  pointer-events: none;
  box-shadow: var(--panel-shadow);
}
.search-hit circle {
  stroke: #ff9900 !important;
  stroke-width: 3px !important;
}
.search-hit text {
  font-weight: bold;
  fill: #ff9900 !important;
}</style>
<!-- Center + top panel + side panels: per-theme backgrounds.
     Theme toggle (body.light) switches which color is used. -->
<style>
  body {
    background: #222222;
  }
  body .top-panel {
    background: #222222;
  }
  body .stats-panel {
    background: #222222;
  }
  body.light {
    background: #ffffff;
  }
  body.light .top-panel {
    background: #ffffff;
  }
  body.light .stats-panel {
    background: #ffffff;
  }
</style>

<script>(function() {

  // Note that funcSource should not BE the new method, it should be a function
  // that RETURNS the new method. funcSource receives a single argument that is
  // the overridden method, it can be called from the new method. The overridden
  // method can be called like a regular function, it has the target permanently
  // bound to it so "this" will work correctly.

    var superFunc = target[methodName] || function() {};
    var superFuncBound = function() {

  // Add a method to delegator that, when invoked, calls
  // delegatee.methodName. If there is no such method on
  // the delegatee, but there was one on delegator before
  // delegateMethod was called, then the original version
  // is invoked instead.
  // For example:
  //
  // var a = {
  //   method1: function() { console.log('a1'); }
  //   method2: function() { console.log('a2'); }
  // };
  // var b = {
  //   method1: function() { console.log('b1'); }
  // };
  // delegateMethod(a, b, "method1");
  // delegateMethod(a, b, "method2");
  // a.method1();
  // a.method2();
  //
  // The output would be "b1", "a2".
  function delegateMethod(delegator, delegatee, methodName) {
    var inherited = delegator[methodName];
    delegator[methodName] = function() {
      var target = delegatee;
      var method = delegatee[methodName];

      // The method doesn't exist on the delegatee. Instead,
      // call the method on the delegator, if it exists.

        method = inherited;

        arguments.length);

    return re.test(el.className);

  // className - class name to test for

  //   if false, only return elements *without* given className

        results.push(elements[i]);

    return results;
  }

    }

      obj.removeEventListener(eventName, func, false);
    else if (obj.detachEvent) {
      obj.detachEvent(eventName, func);
    }

  // the "padding" CSS property
  // https://developer.mozilla.org/en-US/docs/Web/CSS/padding

    }
    if (value.length === 2) {
      return {top: value[0], right: value[1], bottom: value[0], left: value[1]};
    }
    if (value.length === 3) {
      return {top: value[0], right: value[1], bottom: value[2], left: value[1]};
    }

    }

  //   Each element must be a valid JavaScript expression that yields a
  //   function. Or, can be an array of objects with "code" and "data"

  //   of JS that's an expr that yields a function, and "data" should be
  //   an object that will be added as an additional argument when that
  //   function is called.

  //   same arguments will be passed to all functions.)

          task = task.code;

        var taskFunc = tryEval(task);
        if (typeof(taskFunc) !== "function") {

        }
        taskFunc.apply(target, theseArgs);

  // Note that enclosing coerces a function declaration into
  // an expression that eval() can parse

      try {
        result = eval(code);
      } catch(e) {
        if (e instanceof SyntaxError) {
          throw error;
        } else {
          throw e;

    return result;

      document.body.style.margin = "0";
      document.body.style.padding = paddingToCss(unpackPadding(sizing.padding));

      document.body.style.overflow = "hidden";
      document.body.style.width = "100%";
      document.body.style.height = "100%";
      document.documentElement.style.width = "100%";
      document.documentElement.style.height = "100%";
      cel.style.position = "absolute";
      var pad = unpackPadding(sizing.padding);
      cel.style.top = pad.top + "px";
      cel.style.right = pad.right + "px";
      cel.style.bottom = pad.bottom + "px";
      cel.style.left = pad.left + "px";
      el.style.width = "100%";
      el.style.height = "100%";

      el.style.height = px(sizing.height);

    // instance fields or functional-style closure variables (I guess this

    // what we required before).

<script>HTMLWidgets.widget({

  name: 'collapsibleTree',
  type: 'output',

  factory: function(el, width, height) {

    var i = 0,
    duration = 750,
    root = {},
    options = {},
    treemap;

    // Optionally enable zooming, and limit to 1/5x or 5x of the original viewport
    var zoom = d3.zoom()
    .scaleExtent([1/5, 5])
    .on('zoom', function () {
      svg.attr('transform', d3.event.transform)
    })

    // create our tree object and bind it to the element
    // appends a 'group' element to 'svg'
    // moves the 'group' element to the top left margin
    var svg = d3.select(el).append('svg')
    .attr('width', width)
    .attr('height', height)
    .append('g');

    // Define the div for the tooltip
    var tooltip = d3.select(el).append('div')
    .attr('class', 'tooltip')
    .style('opacity', 0);

    // Translate so the visible tree bbox is centered in the svg viewport.
    // Horizontal tree: d.y = depth (x-axis), d.x = sibling rank (y-axis).
    function centerTree() {
      if (!root || typeof root.descendants !== 'function') return;
      var nodes = root.descendants();
      if (!nodes.length) return;

      var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      nodes.forEach(function(d) {
        if (d.x < minX) minX = d.x;
        if (d.x > maxX) maxX = d.x;
        if (d.y < minY) minY = d.y;
        if (d.y > maxY) maxY = d.y;
      });

      // Padding for node radius + labels
      var pad = 40;
      minX -= pad;
      maxX += pad;
      minY -= pad;
      maxY += pad + 80;

      var treeW = Math.max(maxY - minY, 1);
      var treeH = Math.max(maxX - minX, 1);
      var svgEl = d3.select(el).select('svg');
      var w = +svgEl.attr('width') || width;
      var h = +svgEl.attr('height') || height;
      var tx = (w - treeW) / 2 - minY;
      var ty = (h - treeH) / 2 - minX;

      if (options.zoomable) {
        svgEl.call(zoom.transform, d3.zoomIdentity.translate(tx, ty));
      } else {
        svg.attr('transform', 'translate(' + tx + ',' + ty + ')');
      }
    }

    function update(source) {

      // Assigns the x and y position for the nodes
      var treeData = treemap(root);

      // Compute the new tree layout.
      var nodes = treeData.descendants(),
      links = treeData.descendants().slice(1);

      // Normalize for fixed-depth.
      nodes.forEach(function(d) {d.y = d.depth * options.linkLength});

      // ****************** Nodes section ***************************

      // Update the nodes...
      var node = svg.selectAll('g.node')
      .data(nodes, function(d) {return d.id || (d.id = ++i); });

      // Enter any new modes at the parent's previous position.
      var nodeEnter = node.enter().append('g')
      .attr('class', 'node')
      .attr('transform', function(d) {
        return 'translate(' + source.y0 + ',' + source.x0 + ')';
      })
      .on('click', click);

      // Add tooltips, if specified in options
      if (options.tooltip) {
        nodeEnter = nodeEnter
        .on('mouseover', mouseover)
        .on('mouseout', mouseout);
      }

      // Enable zooming, if specified
      if (options.zoomable) d3.select(el).select('svg').call(zoom)

      // Add Circle for the nodes
      nodeEnter.append('circle')
      .attr('class', 'node')
      .attr('r', 1e-6)
      .style('fill', function(d) { return d.data.node_color || (d._children ? options.fill : '#fff'); })
      .style('stroke-width', function(d) { return d.data.edge_size || (d._children ? 3 : 1) ;} )
      .style('stroke', function(d) { return d.data.edge_color ;} )
      .style('opacity', function(d) { return d.data.node_opacity ;} )
      ;
        
      // Add labels for the nodes
      nodeEnter.append('text')
      .attr('dy', '.35em')
      .attr('x', function(d) {
        // Scale padding for label to the size of node
        var padding = (d.data.node_size || 10) + 3
        return d.children || d._children ? -1 * padding : padding;
      })
      .attr('text-anchor', function(d) {
        return d.children || d._children ? 'end' : 'start';
      })
      .style('font-size', options.fontSize + 'px')
      .text(function(d) { return d.data.name; });

      // UPDATE
      var nodeUpdate = nodeEnter.merge(node);

      // Transition to the proper position for the node
      nodeUpdate.transition()
      .duration(duration)
      .attr('transform', function(d) {
        return 'translate(' + d.y + ',' + d.x + ')';
      });

      // Update the node attributes and style
      nodeUpdate.select('circle.node')
      .attr('r', function(d) { return d.data.node_size || 10; }) // default radius is 10
      .style('fill', function(d) {return d.data.node_color || (d._children ? options.fill : '#fff'); })
      .style('stroke-width', function(d) { return d.data.edge_size || (d._children ? 3 : 1) ;} )
      .style('stroke', function(d) { return d.data.edge_color ;} )
      .style('opacity', function(d) { return d.data.node_opacity ;} )
      .attr('cursor', 'pointer');

      // Re-apply font size so the slider (and any option change) takes effect
      // on existing labels, not only on newly entered nodes.
      nodeUpdate.select('text')
      .style('font-size', options.fontSize + 'px');


      // Remove any exiting nodes
      var nodeExit = node.exit().transition()
      .duration(duration)
      .attr('transform', function(d) {
        return 'translate(' + source.y + ',' + source.x + ')';
      })
      .remove();

      // On exit reduce the node circles size to 0
      nodeExit.select('circle')
      .attr('r', 1e-6);

      // On exit reduce the opacity of text labels
      nodeExit.select('text')
      .style('fill-opacity', 1e-6);

      // ****************** links section ***************************

      // Update the links...
      var link = svg.selectAll('path.link')
      .data(links, function(d) { return d.id; });

      // Enter any new links at the parent's previous position.
      var linkEnter = link.enter().insert('path', 'g')
      .attr('class', 'link')
      // Potentially, this may one day be mappable
      // .style('stroke-width', function(d) { return d.data.linkWidth || 1 })
      .attr('d', function(d){
        var o = { x: source.x0, y: source.y0 }
        return diagonal(o, o)
      });

      // UPDATE
      var linkUpdate = linkEnter.merge(link);

      // Transition back to the parent element position
      linkUpdate.transition()
      .duration(duration)
      .attr('d', function(d){ return diagonal(d, d.parent) });

      // Remove any exiting links
      var linkExit = link.exit().transition()
      .duration(duration)
      .attr('d', function(d) {
        var o = {x: source.x, y: source.y}
        return diagonal(o, o)
      })
      .remove();

      // Store the old positions for transition.
      nodes.forEach(function(d){
        d.x0 = d.x;
        d.y0 = d.y;
      });

      // Creates a curved (diagonal) path from parent to the child nodes
      function diagonal(s, d) {

        path = 'M ' + s.y + ' ' + s.x + ' C ' +
        (s.y + d.y) / 2 + ' ' + s.x + ', ' +
        (s.y + d.y) / 2 + ' ' + d.x + ', ' +
        d.y + ' ' + d.x;

        return path
      }

      // Toggle children on click.
      function click(d) {
        if (d.children) {
          d._children = d.children;
          d.children = null;
        } else {
          d.children = d._children;
          d._children = null;
        }
        update(d);
        // Hide the tooltip after clicking
        tooltip.transition()
        .duration(100)
        .style('opacity', 0)
        // Update inputs, if applicable
        if (options.input) {
          var nest = {},
          obj = d;
          // Navigate up the list and recursively find parental nodes
          for (var n = d.depth; n > 0; n--) {
            nest[options.hierarchy[n-1]] = obj.data.name
            obj = obj.parent
          }
          Shiny.onInputChange(options.input, nest)
        }
      }

      // Show tooltip on mouseover
      function mouseover(d) {
        tooltip.transition()
        .duration(200)
        .style('opacity', .9);

        // Show either a constructed tooltip, or override with one from the data
        //tooltip.html( d.data.tooltip || d.data.name + '<br>' +  options.attribute + ': ' + d.data.WeightOfNode )
        tooltip.html( d.data.tooltip )
        // Make the tooltip font size just a little bit bigger
        .style('font-size', (options.fontSize + 1) + 'px')
        .style('left', (d3.event.layerX) + 'px')
        .style('top', (d3.event.layerY - 30) + 'px');
      }
      // Hide tooltip on mouseout
      function mouseout(d) {
        tooltip.transition()
        .duration(500)
        .style('opacity', 0);
      }
    }

    return {
      renderValue: function(x) {
        // Assigns parent, children, height, depth
        root = d3.hierarchy(x.data, function(d) { return d.children; });
        root.x0 = height / 2;
        root.y0 = 0;

        // Attach options as a property of the instance
        options = x.options;

        // Update the canvas with the new dimensions
        svg = svg.attr('transform', 'translate('
        + options.margin.left + ',' + options.margin.top + ')')

        // width and height, corrected for margins
        var heightMargin = height - options.margin.top - options.margin.bottom,
        widthMargin = width - options.margin.left - options.margin.right;
        // declares a tree layout and assigns the size
        treemap = d3.tree().size([heightMargin, widthMargin])
        .separation(separationFun);

        // Calculate a reasonable link length, if not otherwise specified
        if (!options.linkLength) {
          options.linkResponsive = true
          options.linkLength = widthMargin / options.hierarchy.length
          if (options.linkLength < 10) {
            options.linkLength = 10 // Offscreen or too short
          }
        }

        // Optionally collapse after the second level
        if (options.collapsed) root.children.forEach(collapse);
        update(root);

        // Center the tree in the viewport on first render
        centerTree();

        // Collapse the node and all it's children
        function collapse(d) {
          if(d.children) {
            d._children = d.children
            d._children.forEach(collapse)
            d.children = null
          }
        }

        // Expose controls for the GUI panels
        window.__d3treeInstance = {
          root: root,
          options: options,
          update: update,
          svg: svg,
          centerTree: centerTree
        };
      },


      resize: function(width, height) {
        // Resize the canvas
        d3.select(el).select('svg')
        .attr('width', width)
        .attr('height', height);

        // width and height, corrected for margins
        var heightMargin = height - options.margin.top - options.margin.bottom,
        widthMargin = width - options.margin.left - options.margin.right;

        // Calculate a reasonable link length, if not originally specified
        if (options.linkResponsive) {
          options.linkLength = widthMargin / options.hierarchy.length
          if (options.linkLength < 10) {
            options.linkLength = 10 // Offscreen or too short
          }
        }
        // Update the treemap to fit the new canvas size
        treemap = d3.tree().size([heightMargin, widthMargin])
        .separation(separationFun);
        update(root)
      },
      // Make the instance properties available as a property of the widget
      svg: svg,
      root: root,
      options: options
    };
  }
});

function separationFun(a, b) {
  var height = a.data.node_size + b.data.node_size,
  // Scale distance to node_size, if defined
  distance = (height || 20) / 10;
  return (a.parent === b.parent ? 1 : distance);
};
</script>

<script>
(function() {
  var PANEL_ORDER = ['exportPanel', 'treePanel'];

  function positionSidePanels() {
    var bar = document.querySelector('.top-panel');
    var main = document.getElementById('tree-main');
    // When top bar is absent, treat its height as 0 (do not return early).
    var bottom = bar ? bar.getBoundingClientRect().bottom : 0;
    if (main) main.style.marginTop = (bottom + 12) + 'px';
    var y = bottom + 8;
    var bottomPad = 12;
    PANEL_ORDER.forEach(function(id) {
      var panel = document.getElementById(id);
      if (!panel || panel.style.display === 'none') return;
      panel.style.top = y + 'px';
      panel.style.maxHeight = Math.max(80, window.innerHeight - y - bottomPad) + 'px';
      y += panel.getBoundingClientRect().height + 10;
    });
  }
  window.addEventListener('resize', positionSidePanels);
  window.addEventListener('load', positionSidePanels);
  positionSidePanels();
  requestAnimationFrame(positionSidePanels);
  if (typeof ResizeObserver !== 'undefined') {
    PANEL_ORDER.forEach(function(id) {
      var el = document.getElementById(id);
      if (!el) return;
      new ResizeObserver(function() { positionSidePanels(); }).observe(el);
    });
  }

  PANEL_ORDER.forEach(function(panelId) {
    var panel = document.getElementById(panelId);
    if (!panel) return;
    var title = panel.querySelector('.stats-panel-title');
    if (!title) return;
    title.addEventListener('click', function() {
      if (title.dataset.justDragged === '1') { title.dataset.justDragged = '0'; return; }
      var collapsing = !panel.classList.contains('collapsed');
      if (collapsing) {
        if (panel.style.height) panel.dataset.expandedHeight = panel.style.height;
        panel.style.height = '';
      } else if (panel.dataset.expandedHeight) {
        panel.style.height = panel.dataset.expandedHeight;
      }
      panel.classList.toggle('collapsed');
      setTimeout(positionSidePanels, 0);
    });
  });

  (function setupPanelReordering() {
    PANEL_ORDER.forEach(function(panelId) {
      var panel = document.getElementById(panelId);
      if (!panel) return;
      var title = panel.querySelector('.stats-panel-title');
      if (!title) return;
      title.addEventListener('dragstart', function(e) {
        e.dataTransfer.setData('text/plain', panelId);
        e.dataTransfer.effectAllowed = 'move';
      });
      title.addEventListener('dragend', function() {
        title.dataset.justDragged = '1';
        setTimeout(function() { title.dataset.justDragged = '0'; }, 0);
      });
      panel.addEventListener('dragover', function(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        panel.classList.add('drag-over');
      });
      panel.addEventListener('dragleave', function() { panel.classList.remove('drag-over'); });
      panel.addEventListener('drop', function(e) {
        e.preventDefault();
        panel.classList.remove('drag-over');
        var draggedId = e.dataTransfer.getData('text/plain');
        if (!draggedId || draggedId === panelId) return;
        var from = PANEL_ORDER.indexOf(draggedId), to = PANEL_ORDER.indexOf(panelId);
        if (from < 0 || to < 0) return;
        PANEL_ORDER.splice(from, 1);
        PANEL_ORDER.splice(to, 0, draggedId);
        positionSidePanels();
      });
    });
  })();

  function toggleTheme() {
    document.body.classList.toggle('light');
    var isLight = document.body.classList.contains('light');
    var themeBtn = document.getElementById('themeBtn');
    if (themeBtn) {
      themeBtn.textContent = isLight ? '☀' : '🌙';
      themeBtn.title = isLight ? 'Theme: Light' : 'Theme: Dark';
    }
  }
  var themeBtn = document.getElementById('themeBtn');
  if (themeBtn) themeBtn.addEventListener('click', toggleTheme);

  function getTreeInstance() {
    return window.__d3treeInstance || null;
  }

  function expandAll() {
    var inst = getTreeInstance();
    if (!inst || !inst.root || !inst.update) return;
    function expand(d) {
      if (d._children) { d.children = d._children; d._children = null; }
      if (d.children) d.children.forEach(expand);
    }
    expand(inst.root);
    inst.update(inst.root);
  }
  function collapseAll() {
    var inst = getTreeInstance();
    if (!inst || !inst.root || !inst.update) return;
    function collapse(d) {
      if (d.children) {
        d._children = d.children;
        d._children.forEach(collapse);
        d.children = null;
      }
    }
    if (inst.root.children) inst.root.children.forEach(collapse);
    inst.update(inst.root);
  }
  var expandBtn = document.getElementById('expandAllBtn');
  var collapseBtn = document.getElementById('collapseAllBtn');
  if (expandBtn) expandBtn.addEventListener('click', expandAll);
  if (collapseBtn) collapseBtn.addEventListener('click', collapseAll);

  // Export hierarchy as JSON
  function hierarchyToPlain(d) {
    if (!d) return null;
    var kids = d.children || d._children;
    var out = { name: (d.data && d.data.name) || d.name || '' };
    if (d.data) {
      if (d.data.tooltip) out.tooltip = d.data.tooltip;
      if (d.data.node_color) out.node_color = d.data.node_color;
      if (d.data.node_size != null) out.node_size = d.data.node_size;
    }
    if (kids && kids.length) out.children = kids.map(hierarchyToPlain);
    return out;
  }
  var exportBtn = document.getElementById('exportButton');
  if (exportBtn) {
    exportBtn.addEventListener('click', function() {
      var inst = getTreeInstance();
      var payload = inst && inst.root ? hierarchyToPlain(inst.root) : null;
      if (!payload) { alert('Tree not ready yet.'); return; }
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'tree-export.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 0);
    });
  }

  var fontSlider = document.getElementById('fontSizeSlider');
  var fontVal = document.getElementById('fontSizeVal');
  if (fontSlider) {
    fontSlider.addEventListener('input', function() {
      var v = +fontSlider.value;
      if (fontVal) fontVal.textContent = v;
      var inst = getTreeInstance();
      if (inst && inst.options) {
        inst.options.fontSize = v;
        if (inst.update && inst.root) inst.update(inst.root);
      }
    });
  }

  var linkSlider = document.getElementById('linkLengthSlider');
  var linkVal = document.getElementById('linkLengthVal');
  if (linkSlider) {
    linkSlider.addEventListener('input', function() {
      var v = +linkSlider.value;
      if (linkVal) linkVal.textContent = v + 'px';
      var inst = getTreeInstance();
      if (inst && inst.options) {
        inst.options.linkLength = v;
        inst.options.linkResponsive = false;
        if (inst.update && inst.root) inst.update(inst.root);
      }
    });
  }

  // Search: highlight matching node labels
  var searchInput = document.getElementById('searchInput');
  var searchResults = document.getElementById('searchResults');
  function clearSearchHits() {
    document.querySelectorAll('.search-hit').forEach(function(el) {
      el.classList.remove('search-hit');
    });
  }
  function collectNodeNames(d, out) {
    if (!d) return;
    var name = (d.data && (d.data.name || d.data.tooltip)) || '';
    if (name) out.push({ name: String(name), node: d });
    var kids = d.children || d._children || [];
    kids.forEach(function(c) { collectNodeNames(c, out); });
  }
  function renderSearchResults(q) {
    if (!searchResults) return;
    q = (q || '').trim().toLowerCase();
    clearSearchHits();
    if (!q) { searchResults.classList.remove('open'); searchResults.innerHTML = ''; return; }
    var inst = getTreeInstance();
    var names = [];
    if (inst && inst.root) collectNodeNames(inst.root, names);
    var hits = names.filter(function(n) { return n.name.toLowerCase().indexOf(q) >= 0; }).slice(0, 30);
    if (!hits.length) {
      searchResults.innerHTML = '<div class="search-item" style="opacity:0.6">No matches</div>';
      searchResults.classList.add('open');
      return;
    }
    searchResults.innerHTML = hits.map(function(h, i) {
      return '<div class="search-item" data-idx="' + i + '">' + h.name.replace(/</g, '&lt;') + '</div>';
    }).join('');
    searchResults.classList.add('open');
    searchResults.querySelectorAll('.search-item').forEach(function(el, i) {
      el.addEventListener('click', function() {
        var hit = hits[i];
        if (!hit) return;
        // Expand path to node
        var path = [];
        var cur = hit.node;
        while (cur) { path.unshift(cur); cur = cur.parent; }
        path.forEach(function(n) {
          if (n._children) { n.children = n._children; n._children = null; }
        });
        if (inst.update) inst.update(inst.root);
        clearSearchHits();
        // Highlight by matching text content
        document.querySelectorAll('.node').forEach(function(g) {
          var t = g.querySelector('text');
          if (t && t.textContent === hit.name) g.classList.add('search-hit');
        });
        searchResults.classList.remove('open');
        if (searchInput) searchInput.blur();
      });
    });
  }
  if (searchInput) {
    searchInput.addEventListener('input', function() { renderSearchResults(searchInput.value); });
    searchInput.addEventListener('focus', function() { if (searchInput.value.trim()) renderSearchResults(searchInput.value); });
    searchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        searchResults.classList.remove('open');
        searchInput.blur();
        clearSearchHits();
      }
    });
  }
  document.addEventListener('click', function(e) {
    if (searchResults && searchInput && !searchResults.contains(e.target) && e.target !== searchInput) {
      searchResults.classList.remove('open');
    }
  });

  // After htmlwidgets renders, capture instance and sync link-length slider
  function tryBindInstance() {
    var el = document.getElementById('htmlwidget-treemap');
    if (!el || !window.HTMLWidgets) return false;
    // Prefer explicit export set by the widget
    if (window.__d3treeInstance) {
      var inst = window.__d3treeInstance;
      if (inst.options && inst.options.linkLength && linkSlider) {
        linkSlider.value = Math.max(20, Math.min(300, inst.options.linkLength));
        if (linkVal) linkVal.textContent = Math.round(inst.options.linkLength) + 'px';
      }
      return true;
    }
    return false;
  }
  // Poll briefly until widget sets __d3treeInstance
  var tries = 0;
  var timer = setInterval(function() {
    tries++;
    if (tryBindInstance() || tries > 40) clearInterval(timer);
  }, 100);
})();
</script>
